<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <!-- React 앱 시작 전 다크모드 적용 -->
        <script>
            const theme = localStorage.getItem('theme') || 'system'; // 기본값 설정
            let finalTheme = theme;

            if (theme === 'system') {
                const prefersDark = window.matchMedia(
                    '(prefers-color-scheme: dark)'
                ).matches;
                finalTheme = prefersDark ? 'dark' : 'light';
            }

            if (finalTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        </script>
        <link rel="icon" href="%PUBLIC_URL%/upday_favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta
            name="description"
            content="매일의 성장을 돕는 소셜 챌린지 플랫폼 UpDay"
        />

        <link rel="apple-touch-icon" href="%PUBLIC_URL%/upday_logo.svg" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

        <!-- Open Graph 설정 -->
        <meta property="og:title" content="UpDay" />
        <meta
            property="og:description"
            content="매일의 성장을 돕는 소셜 챌린지 플랫폼"
        />
        <meta property="og:image" content="%PUBLIC_URL%/upday_favicon.svg" />
        <meta property="og:type" content="website" />

        <title>UpDay</title>
    </head>
    <body>
        <noscript
            >이 사이트를 사용하려면 JavaScript를 활성화해야 합니다.</noscript
        >
        <div id="root"></div>
    </body>
</html>
